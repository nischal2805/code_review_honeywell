dal_level: B
output_dir: output
cache_dir: .rag_cache
embedding_model: all-MiniLM-L6-v2
ollama_url: http://localhost:11434
ollama_model: gemma2:2b
ollama_enabled: true
max_workers: 4
entry_points:
  - main
lru_names:
  - Motor
  - Battery
  - Throttle
  - PID
  - Gyro
  - Compass
  - GPS
cyclomatic_complexity_max: 10
function_length_max: 50
nesting_depth_max: 5
param_count_max: 7
faiss_similarity_threshold: 0.6
