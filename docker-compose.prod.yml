version: "3.9"

services:
  rag-engine:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:72b
      - OLLAMA_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 8g

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 32g
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1

# First-time model pull:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml exec ollama ollama pull qwen2.5-coder:72b
